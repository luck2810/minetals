<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixelands</title>
<style>
:root{--bg:#141a2a;--fg:#f6f0dc;--panel:rgba(14,18,30,.8);--accent:#f2b134;--line:#3a4668;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2a;--fg:#f6f0dc;--panel:rgba(14,18,30,.8)}}
:root[data-theme="dark"]{--bg:#141a2a;--fg:#f6f0dc;--panel:rgba(14,18,30,.8)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Courier New",monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:relative;width:100%;height:100%}
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.hud{position:absolute;background:var(--panel);border:3px solid var(--line);padding:8px 10px;font-size:10px;line-height:1.6}
#info{top:10px;left:10px}
#mini{top:10px;right:10px;padding:3px;line-height:0}
#mini canvas{width:96px;height:96px;image-rendering:pixelated}
#hint{bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap}
button{font:inherit;color:var(--fg);background:var(--panel);border:3px solid var(--accent);padding:10px 14px;cursor:pointer;font-size:11px}
#newworld{position:absolute;top:96px;left:10px;font-size:9px;padding:7px 9px;border-color:var(--line)}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,13,22,.88);text-align:center;padding:20px}
#title h1{font-size:clamp(22px,7vw,44px);margin:0;color:var(--accent);text-shadow:4px 4px 0 #6b3a14}
#title p{font-size:10px;line-height:1.9;max-width:34ch;margin:0}
#joy{display:none;position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:26px;width:130px;height:130px;border:3px solid var(--line);border-radius:50%;background:var(--panel)}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:var(--accent);border:3px solid #6b3a14}
#hint{bottom:68px}
#inv{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;font-size:9px;max-width:92vw}
#inv .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#inv button{font-size:9px;padding:6px 8px;border-color:var(--line)}
#inv button.sel{border-color:var(--accent)}
#btns{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:26px;display:flex;flex-direction:column;gap:8px}
#btns button{width:88px}
#toast{top:70px;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#craft{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,13,22,.7);padding:16px}
#craft.on{display:flex}
#craftbox{display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);background:var(--panel);border:3px solid var(--line);padding:12px}
#craftbox button{text-align:left;font-size:10px;line-height:1.6;border-color:var(--line)}
#craftbox button:disabled{opacity:.45;cursor:default}
#craftbox h2{font-size:12px;margin:0 0 4px;color:var(--accent)}
#info{white-space:pre}
#starter,#battle{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,13,22,.82);padding:16px}
#starter.on,#battle.on{display:flex}
#starterbox,#bbox{display:flex;flex-direction:column;gap:10px;width:min(94vw,460px);background:var(--panel);border:3px solid var(--line);padding:12px}
#starterbox h2{font-size:12px;margin:0;color:var(--accent)}
.srow{display:flex;gap:8px}
.srow button{flex:1;text-align:center;font-size:10px;line-height:1.7;border-color:var(--line)}
.srow canvas,.brow canvas{width:min(24vw,104px);height:min(24vw,104px);image-rendering:pixelated}
.brow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.info{flex:1;font-size:10px;line-height:1.8}
.bar{height:10px;background:#1b1f2c;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:#4caf50;transition:width .4s}
.hit{filter:brightness(2.6)}
#msg{min-height:44px;font-size:10px;line-height:1.7;border:3px solid var(--line);padding:8px}
#menu{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
#menu button{flex:1 1 40%;font-size:10px;border-color:var(--line)}
#dlg{display:none;top:120px;left:50%;transform:translateX(-50%);width:min(92vw,420px);line-height:1.8;font-size:10px}
#dlg.on{display:block}
#dok{margin-top:8px;width:100%}
#mute{position:absolute;top:130px;left:10px;font-size:9px;padding:7px 9px;border-color:var(--line)}
#dexbtn{position:absolute;top:164px;left:10px;font-size:9px;padding:7px 9px;border-color:var(--line)}
#dex{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,13,22,.88);padding:10px}
#dex.on{display:flex}
#dexbox{width:min(96vw,540px);max-height:94%;overflow:auto;background:var(--panel);border:3px solid var(--line);padding:10px}
#dexbox h2{font-size:12px;color:var(--accent);margin:0 0 6px}
.dsum{font-size:9px;margin-bottom:8px;line-height:1.7}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.dcard{padding:4px;font-size:8px;line-height:1.6;text-align:center;border-color:var(--line)}
.dcard canvas{width:100%;aspect-ratio:1;image-rendering:pixelated}
.dk{filter:brightness(0) opacity(.25)}
.dhead{display:flex;gap:10px;align-items:center;margin:8px 0}
.dbig{width:42%;max-width:180px;aspect-ratio:1;image-rendering:pixelated;background:rgba(255,255,255,.06);border:3px solid var(--line)}
.dtype{display:inline-block;padding:3px 7px;font-size:9px;margin:4px 0;color:#fff}
.dnum{font-size:9px;opacity:.8}
.dbar{height:8px;background:#1b1f2c;border:2px solid var(--line);margin:2px 0 6px}
.dbar i{display:block;height:100%;background:var(--accent)}
#dexbox p{font-size:10px;line-height:1.8;margin:6px 0}
@media (pointer:coarse){#joy{display:block}#hint{display:none}#inv{bottom:170px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="info" class="hud"></div>
  <div id="mini" class="hud"><canvas id="mm" width="96" height="96"></canvas></div>
  <button id="newworld">Novo mundo</button>
  <button id="mute">Som: ligado</button>
  <button id="dexbtn">Pokédex</button>
  <div id="hint" class="hud">Setas/WASD andar · E ação · Q pôr bloco · C criar · 1-4 trocar bloco</div>
  <div id="inv" class="hud"></div>
  <div id="btns"><button id="bAct">Ação</button><button id="bPut">Pôr</button><button id="bCraft">Criar</button></div>
  <div id="toast" class="hud"></div>
  <div id="craft"><div id="craftbox"></div></div>
  <div id="battle"><div id="bbox">
    <div class="brow"><div class="info"><div id="fn"></div><div class="bar"><i id="fb"></i></div></div><canvas id="fc" width="16" height="16"></canvas></div>
    <div class="brow"><canvas id="pc" width="16" height="16"></canvas><div class="info"><div id="pn"></div><div class="bar"><i id="pb"></i></div><div id="ph"></div></div></div>
    <div id="msg"></div><div id="menu"></div>
  </div></div>
  <div id="starter"><div id="starterbox"></div></div>
  <div id="dex"><div id="dexbox"></div></div>
  <div id="dlg" class="hud"><div id="dtext"></div><button id="dok">OK</button></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="title">
    <h1>PIXELANDS</h1>
    <p>Explore, colete, construa, capture criaturas e derrote os 3 guardiões.</p>
    <button id="play">Novo jogo</button>
    <button id="cont" style="display:none">Continuar</button>
  </div>
</div>
<script>
// ===== Configuração =====
const W = 96, H = 96;          // tamanho do mundo em blocos
const ENCOUNTER_RATE = 0.15;   // chance de encontro por passo na grama alta
const MOVE_TIME = 0.15;        // segundos para andar um bloco
const BIOMES = ['Lago','Campos','Floresta','Deserto','Montanha','Tundra','Praia'];
const SOLID = new Set([0,3,4,5,6,9,10,12,13,14]);

// ===== Ruído com semente =====
function h(x,y,s){let n=x*374761393+y*668265263+s*982451653;n=(n^(n>>>13))*1274126177|0;n^=n>>>16;return (n>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=h(xi,yi,s),b=h(xi+1,yi,s),c=h(xi,yi+1,s),d=h(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return vn(x/14,y/14,s)*.55+vn(x/7,y/7,s+1)*.3+vn(x/3.5,y/3.5,s+2)*.15}

// ===== Texturas em pixel art (geradas por código) =====
const mk=fn=>{const c=document.createElement('canvas');c.width=c.height=16;fn(c.getContext('2d'));return c};
const R=(g,c,x,y,w,hh)=>{g.fillStyle=c;g.fillRect(x,y,w,hh)};
function speck(g,base,cols,n,s){R(g,base,0,0,16,16);for(let i=0;i<n;i++)R(g,cols[i%cols.length],(h(i,1,s)*16)|0,(h(i,2,s)*16)|0,1,1)}
const grass=g=>speck(g,'#4fa24a',['#43933f','#5db557','#3b8738'],26,5);
const sand=g=>speck(g,'#e3c98a',['#d4b672','#efdba3'],20,6);
const snow=g=>speck(g,'#eef5fb',['#d6e4f0','#ffffff'],18,7);
const stone=g=>{speck(g,'#8b8e96',['#7a7d85','#9ba0a8'],30,8);R(g,'#6f727a',0,7,16,1);R(g,'#6f727a',8,0,1,7);R(g,'#6f727a',4,8,1,8)};
const water=f=>mk(g=>{R(g,'#2f6fd0',0,0,16,16);for(let i=0;i<6;i++)R(g,'#5b98ee',((h(i,3,9)*12)|0)+f*2,(h(i,4,9)*16)|0,4,1)});
const TEX=[null,mk(sand),mk(grass),
 mk(g=>{grass(g);R(g,'#4a2f18',7,9,2,6);R(g,'#2a6e30',3,1,10,9);R(g,'#37923f',4,2,8,6);R(g,'#55b857',5,3,3,2)}),
 mk(stone),
 mk(g=>{stone(g);R(g,'#e8c24a',3,3,2,2);R(g,'#1d1f24',10,4,2,2);R(g,'#d98f5b',5,10,2,2);R(g,'#e8c24a',11,11,2,1)}),
 mk(g=>{sand(g);R(g,'#2a7a45',6,3,4,11);R(g,'#2a7a45',3,6,3,2);R(g,'#2a7a45',3,4,2,3);R(g,'#2a7a45',10,8,3,2);R(g,'#2a7a45',11,6,2,3);R(g,'#4cb06a',7,4,1,8)}),
 mk(snow),
 mk(g=>{grass(g);for(const x of [2,5,8,11,13])R(g,'#2d7a34',x,7+(x%3),1,5)}),
 mk(g=>{snow(g);R(g,'#5a3b22',7,12,2,3);R(g,'#2c6b4a',7,1,2,2);R(g,'#2c6b4a',5,3,6,2);R(g,'#2c6b4a',3,5,10,3);R(g,'#2c6b4a',2,8,12,4);R(g,'#3d8a5c',6,6,2,1)}),
 mk(g=>{R(g,'#b9824a',0,0,16,16);for(const y of [3,7,11,15])R(g,'#8a5a30',0,y,16,1);R(g,'#8a5a30',5,0,1,3);R(g,'#8a5a30',11,4,1,3);R(g,'#8a5a30',4,8,1,3);R(g,'#8a5a30',10,12,1,3);R(g,'#d09a60',1,1,3,1);R(g,'#d09a60',8,5,3,1)}),
 mk(g=>speck(g,'#5d5a63',['#4b4851','#6f6c77','#7d7a85'],34,11)),
 mk(g=>{R(g,'#6b4423',0,0,16,16);R(g,'#c88a4e',1,1,14,8);R(g,'#8a5a30',1,8,14,1);R(g,'#cfd3d8',3,3,8,1);R(g,'#4a2f18',11,2,3,3);R(g,'#4a2f18',2,10,2,5);R(g,'#4a2f18',12,10,2,5);R(g,'#e0b070',3,6,3,1)}),
 mk(g=>{R(g,'#6b4423',0,0,16,16);R(g,'#f4efe0',2,2,12,5);R(g,'#c04040',2,7,12,7);R(g,'#8a2c2c',2,12,12,2);R(g,'#d9d2c0',3,3,4,3)}),
 mk(g=>{stone(g);R(g,'#5fe0e8',3,4,3,6);R(g,'#b8f8fc',4,4,1,3);R(g,'#5fe0e8',9,7,3,5);R(g,'#b8f8fc',10,7,1,2)})];
const WATER=[water(0),water(1)];
// Sprite das árvores (substitui as árvores e os pinheiros)
const TREE=new Image();
function mk32(bgFn,im){
  const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;g.save();g.scale(2,2);bgFn(g);g.restore();
  const w=im.width*30/im.height;
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.drawImage(im,(32-w)/2,1,w,30);
  return c;
}
// Texturas de grama e neve (blocos 32x32; cada bloco do mapa usa um dos 4 quadrantes de 16x16)
const TREE2=new Image(),GI=new Image(),SI=new Image(),SA=new Image();
let GV=null,SV=null,SAV=null;
const tv=(x,y)=>((x*31+y*17)^(x*y))&3;
const okImg=im=>im.complete&&im.naturalWidth>0;
function quad(im,q){const c=document.createElement('canvas');c.width=c.height=16;c.getContext('2d').drawImage(im,(q%2)*16,(q>>1)*16,16,16,0,0,16,16);return c}
function rebuildTex(){
  if(okImg(GI)&&okImg(SI)){
    GV=[0,1,2,3].map(q=>quad(GI,q));SV=[0,1,2,3].map(q=>quad(SI,q));
    TEX[2]=GV[0];TEX[7]=SV[0];
    TEX[8]=mk(g=>{g.drawImage(GV[0],0,0);for(const x of [2,5,8,11,13])R(g,'#2d7a34',x,7+(x%3),1,5)});
  }
  if(okImg(SA)){ // areia: 4 variantes por espelhamento
    const v=(fx,fy)=>{const c=document.createElement('canvas');c.width=c.height=16;const g=c.getContext('2d');g.translate(fx?16:0,fy?16:0);g.scale(fx?-1:1,fy?-1:1);g.drawImage(SA,0,0,16,16);return c};
    SAV=[v(0,0),v(1,0),v(0,1),v(1,1)];TEX[1]=SAV[0];
    TEX[6]=mk(g=>{g.drawImage(SAV[0],0,0);R(g,'#2a7a45',6,3,4,11);R(g,'#2a7a45',3,6,3,2);R(g,'#2a7a45',3,4,2,3);R(g,'#2a7a45',10,8,3,2);R(g,'#2a7a45',11,6,2,3);R(g,'#4cb06a',7,4,1,8)});
  }
  const gb=GV?g=>g.drawImage(GV[0],0,0):grass,sb=SV?g=>g.drawImage(SV[0],0,0):snow;
  if(okImg(TREE))TEX[3]=mk32(gb,TREE);
  if(okImg(TREE2))TEX[9]=mk32(sb,TREE2);
}
TREE.onload=TREE2.onload=GI.onload=SI.onload=SA.onload=rebuildTex;
// Água do lago: 3 frames animados, textura sem emendas (bordas suavizadas para repetir)
const WI=[new Image(),new Image(),new Image()];let WV=null;
function buildWater(){
  if(!WI.every(okImg))return;
  WV=WI.map(im=>[0,1,2,3].map(q=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
    g.translate(q&1?64:0,q&2?64:0);g.scale(q&1?-1:1,q&2?-1:1);g.drawImage(im,0,0);return c}));
}
WI.forEach(im=>im.onload=buildWater);
// Cascalho (caverna e pedra minerada): grade 20x20, 4 variantes por espelhamento
const CA=new Image();let CAV=null;
CA.onload=()=>{CAV=[0,1,2,3].map(q=>{const c=document.createElement('canvas');c.width=c.height=20;const g=c.getContext('2d');

const COLORS=['#2f6fd0','#e3c98a','#4fa24a','#2a6e30','#8b8e96','#e8c24a','#2a7a45','#eef5fb','#3b8738','#2c6b4a','#b9824a','#5d5a63','#a9703a','#c04040','#5fe0e8'];

// ===== Geração do mundo =====
let tiles, biome, under, mmBase, mmg, seed;
function generate(sd){
  seed=sd;tiles=new Uint8Array(W*H);biome=new Uint8Array(W*H);under=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const e=fbm(x,y,seed),t=fbm(x,y,seed+10),m=fbm(x,y,seed+20),r=h(x,y,seed+99);let T,B;
    if(e<.42){T=0;B=0}
    else if(e<.455){T=1;B=6}
    else if(e>.62){B=4;T=r<.07?5:4}
    else if(t>.57){B=3;T=r<.06?6:1}
    else if(t<.43){B=5;T=r<.12?9:7}
    else if(m>.5){B=2;T=r<.28?3:(r<.33?8:2)}
    else{B=1;T=r<.04?3:(r<.14?8:2)}
    tiles[y*W+x]=T;biome[y*W+x]=B;
  }
  mmBase=document.createElement('canvas');mmBase.width=W;mmBase.height=H;const g=mmg=mmBase.getContext('2d');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){g.fillStyle=COLORS[tiles[y*W+x]];g.fillRect(x,y,1,1)}
}
const walkable=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&!SOLID.has(tiles[y*W+x])&&!entAt(x,y);
function findSpawn(){
  for(let r=0;r<60;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const x=W/2+dx,y=H/2+dy;if(walkable(x,y)&&tiles[y*W+x]===2)return[x,y]}
  return[W/2,H/2];
}

const DIRS=[[0,1],[0,-1],[-1,0],[1,0]]; // baixo, cima, esquerda, direita
function spawn(){const[x,y]=home||findSpawn();Object.assign(P,{x,y,fx:x,fy:y,tx:x,ty:y,t:0,moving:false,face:0})}

const KEYMAP={ArrowDown:0,s:0,S:0,ArrowUp:1,w:1,W:1,ArrowLeft:2,a:2,A:2,ArrowRight:3,d:3,D:3};
addEventListener('keydown',e=>{if(e.key in KEYMAP){e.preventDefault();const d=KEYMAP[e.key];if(!stack.includes(d))stack.push(d)}
  if(dlgOpen){if(!e.repeat&&(e.key==='e'||e.key==='E'||e.key===' '||e.key==='Enter')){e.preventDefault();dlgNext()}return}
  if(!started||battleOpen){if(!started&&(e.key==='Enter'||e.key===' '))start();return}
  const k=e.key.toLowerCase();
  if(k==='e'||k===' '){e.preventDefault();if(!e.repeat)act()}
  else if(k==='q')place();
  else if(k==='c')toggleCraft();
  else if(k==='p')toggleDex();
  else if(k==='escape'){toggleCraft(false);toggleDex(false)}
  else if(k>='1'&&k<='4')selectSlot(+k-1);
});
addEventListener('keyup',e=>{if(e.key in KEYMAP){const i=stack.indexOf(KEYMAP[e.key]);if(i>-1)stack.splice(i,1)}});
addEventListener('blur',()=>{stack.length=0;joyDir=-1});
const joy=document.getElementById('joy'),knob=document.getElementById('knob');
function joyMove(e){const r=joy.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const L=Math.hypot(dx,dy),max=40;if(L>max){dx*=max/L;dy*=max/L}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  joyDir=L<14?-1:(Math.abs(dx)>Math.abs(dy)?(dx<0?2:3):(dy<0?1:0))}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});
joy.addEventListener('pointermove',e=>{if(e.buttons||e.pressure>0)joyMove(e)});
const joyEnd=()=>{joyDir=-1;knob.style.transform=''};
joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
const curDir=()=>joyDir>=0?joyDir:(stack.length?stack[stack.length-1]:-1);

const LBL={madeira:'Madeira',pedra:'Pedra',minerio:'Minério',tabua:'Tábua',bancada:'Bancada',pic1:'Picareta de madeira',pic2:'Picareta de pedra',cristal:'Cristal',erva:'Erva',pocao:'Poção',cama:'Cama',gema:'Gema',superior:'Cristal superior'};
const SEL=[{k:'tabua',tile:10},{k:'pedra',tile:4},{k:'bancada',tile:12},{k:'cama',tile:13}];
const RECIPES=[
 {n:'Bancada',cost:{madeira:4},give:{bancada:1}},
 {n:'4 tábuas',cost:{madeira:2},give:{tabua:4}},
 {n:'3 cristais de captura',cost:{pedra:2,minerio:1},give:{cristal:3}},
 {n:'Poção (cura 30)',cost:{erva:2},give:{pocao:1}},
 {n:'Cama (cura a equipe)',cost:{tabua:4,erva:2},give:{cama:1}},
 {n:'2 cristais superiores',cost:{gema:1,minerio:1},give:{superior:2}},
 {n:'Picareta de madeira',cost:{madeira:5},give:{pic1:1},bench:1,once:'pic1'},

function resetInv(){inv={madeira:0,pedra:0,minerio:0,tabua:0,bancada:0,pic1:0,pic2:0,cristal:5,erva:0,pocao:2,cama:0,gema:0,superior:0};sel=0;toggleCraft(false);renderInv()}
function say(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1400)}
function give(k,n){inv[k]+=n;SFX.pick();say('+'+n+' '+LBL[k].toLowerCase());renderInv()}
function renderInv(){
  const tools=inv.pic2?'Picareta de pedra':inv.pic1?'Picareta de madeira':'Sem picareta';
  $('inv').innerHTML='<div class="row"><span>Madeira '+inv.madeira+'</span><span>Pedra '+inv.pedra+'</span><span>Cristais '+inv.cristal+'</span><span>Ervas '+inv.erva+'</span><span>Gemas '+inv.gema+'</span><span>Poções '+inv.pocao+'</span><span>Minério '+inv.minerio+'</span><span>'+tools+'</span></div><div class="row">'+
   SEL.map((s,i)=>'<button data-i="'+i+'"'+(i===sel?' class="sel"':'')+'>'+(i+1)+' '+LBL[s.k]+' '+inv[s.k]+'</button>').join('')+'</div>';

function selectSlot(i){sel=i;renderInv()}
$('inv').addEventListener('click',e=>{const b=e.target.closest('button');if(b)selectSlot(+b.dataset.i)});
function nearBench(){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=P.x+dx,y=P.y+dy;if(x>=0&&y>=0&&x<W&&y<H&&tiles[y*W+x]===12)return true}return false}
function setTile(i,t){tiles[i]=t;mmg.fillStyle=COLORS[t];mmg.fillRect(i%W,(i/W)|0,1,1)}
function target(){const x=P.x+DIRS[P.face][0],y=P.y+DIRS[P.face][1];return(x<0||y<0||x>=W||y>=H)?-1:y*W+x}
function act(){
  if(!started||craftOpen||dexOpen||P.moving||P.anim)return;
  const i=target();if(i<0)return;const en=entAt(i%W,(i/W)|0);if(en){playAnim('use');return talk(en)}const t=tiles[i];
  if([3,9,4,5,14,10].includes(t))playAnim('break');else if([6,8,12,13].includes(t))playAnim('use');
  if(t===3||t===9){setTile(i,t===3?2:7);give('madeira',2)}
  else if(t===4){if(inv.pic1||inv.pic2){setTile(i,under[i]||11);under[i]=0;give('pedra',1)}else say('Precisa de uma picareta')}
  else if(t===5){if(inv.pic2){setTile(i,11);give('minerio',1)}else say('Precisa de picareta de pedra')}
  else if(t===10){setTile(i,under[i]||2);under[i]=0;give('tabua',1)}
  else if(t===12)toggleCraft(true);
  else if(t===14){if(inv.pic2){setTile(i,11);give('gema',1)}else say('Precisa de picareta de pedra')}
  else if(t===8){setTile(i,2);give('erva',1)}
  else if(t===13){if(team)team.forEach(m=>m.hp=m.max);home=[P.x,P.y];SFX.heal();say('Equipe curada! Ponto de retorno salvo.')}
  else if(t===6)say('Ai! Cacto espinhoso');
}
function place(){
  if(!started||craftOpen||dexOpen||P.moving||P.anim)return;
  const s=SEL[sel],i=target();if(i<0||!walkable(i%W,(i/W)|0))return say('Sem espaço aqui');
  if(!inv[s.k])return say('Sem '+LBL[s.k].toLowerCase());
  under[i]=tiles[i];setTile(i,s.tile);inv[s.k]--;renderInv();SFX.put();playAnim('place');
}
function toggleCraft(v){
  if(!started&&v)return;
  craftOpen=v===undefined?!craftOpen:v;stack.length=0;
  $('craft').classList.toggle('on',craftOpen);if(craftOpen)renderCraft();
}
function renderCraft(){
  const bn=nearBench();
  $('craftbox').innerHTML='<h2>Criar</h2>'+RECIPES.map((r,i)=>{
    const cost=Object.entries(r.cost).map(([k,n])=>n+' '+LBL[k].toLowerCase()).join(' + ');
    const ok=Object.entries(r.cost).every(([k,n])=>inv[k]>=n)&&(!r.bench||bn)&&!(r.once&&inv[r.once]);
    return '<button data-r="'+i+'"'+(ok?'':' disabled')+'>'+r.n+(r.once&&inv[r.once]?' (já tem)':'')+'<br>'+cost+(r.bench?' · perto de bancada':'')+'</button>'}).join('')+'<button data-r="x">Fechar</button>';
}
$('craftbox').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.r==='x')return toggleCraft(false);
  const r=RECIPES[+b.dataset.r];for(const[k,n]of Object.entries(r.cost))inv[k]-=n;
  for(const[k,n]of Object.entries(r.give))inv[k]+=n;say('Criado: '+r.n);renderInv();renderCraft()});
for(const id of ['inv','btns'])$(id).addEventListener('mousedown',e=>e.preventDefault());
$('bAct').addEventListener('click',act);$('bPut').addEventListener('click',place);$('bCraft').addEventListener('click',()=>toggleCraft());

 ['Folhim','planta',12,11,11,11,'#58b84a','#35802c',0],['Musgo','planta',14,9,13,6,'#7a9a3a','#52702a',1],['Broto','planta',11,12,9,13,'#9ad84a','#6aa02a',2],
 ['Pedrito','terra',13,12,13,6,'#a8845a','#78593a',1],['Tatuzão','terra',14,11,14,7,'#b89a6a','#86683e',0],['Cascalho','terra',12,13,11,9,'#9a9aa2','#6a6a72',2],
 ['Vagalume','fogo',11,12,10,13,'#f2d03a','#a8861a',0],['Lunário','agua',12,12,11,10,'#6a5acd','#40338a',2],['Mofego','planta',13,11,12,9,'#7a4a8a','#52305e',1],

let team=null,battleOpen=false,B=null,steps=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const stat=(b,L)=>Math.floor(b*(1+L*.12));
function recalc(m){const s=SPECIES[m.i];m.max=Math.floor(s[2]*(1+m.L*.15))+10;m.atk=stat(s[3],m.L);m.def=stat(s[4],m.L);m.spd=stat(s[5],m.L)}
function mkMon(i,L){const m={i,n:SPECIES[i][0],t:SPECIES[i][1],L,xp:0,mv:[],st:{atk:0,def:0},stat:null,sl:0};LEARN[m.t].forEach(([lv,k])=>{if(lv<=L)learn(m,k)});recalc(m);m.hp=m.max;return m}
function drawMon(g,i){
  const s=SPECIES[i],c=s[6],d=s[7],f=s[8],t=s[1];
  const png=SPRIMG[i]&&okImg(SPRIMG[i]),sz=png?128:16;

const mult=(a,d)=>STR[a].includes(d)?2:STR[d].includes(a)?.5:1;
const pick=m=>MOVES[m.mv[Math.floor(Math.random()*m.mv.length)]];
function bar(el,m){const p=Math.max(0,m.hp/m.max);el.style.width=p*100+'%';el.style.background=p>.5?'#4caf50':p>.2?'#e8b020':'#d8402c'}
function ui(){$('fn').textContent=B.foe.n+' Nv'+B.foe.L+tg(B.foe);$('pn').textContent=B.me.n+' Nv'+B.me.L+tg(B.me);$('ph').textContent=B.me.hp+'/'+B.me.max;bar($('fb'),B.foe);bar($('pb'),B.me)}
function msg(t){$('msg').textContent=t;return wait(900)}
function menu(items){$('menu').innerHTML=items.map((x,i)=>'<button data-m="'+i+'">'+x+'</button>').join('')}
function mainMenu(){B.stage='main';B.busy=false;$('msg').textContent='O que '+B.me.n+' vai fazer?';menu(['Atacar','Itens','Trocar','Fugir'])}
function startBattle(boss){
  const d=Math.hypot(P.x-W/2,P.y-H/2),L=Math.max(2,Math.min(12,2+Math.floor(d/18)+Math.floor(Math.random()*3)-1));
  const foe=boss?boss.mon:mkMon(rollSpecies(),L);
  seen.add(foe.i);B={foe,boss,me:team[0],busy:true,stage:'main'};battleOpen=true;stack.length=0;joyEnd();
  drawMon($('fc').getContext('2d'),foe.i);drawMon($('pc').getContext('2d'),B.me.i);
  $('battle').classList.add('on');menu([]);ui();
  msg(boss?boss.name+' quer batalhar!':'Um '+foe.n+' selvagem apareceu!').then(mainMenu);

function endBattle(){if(B&&B.boss){B.boss.mon.hp=B.boss.mon.max;fixMon(B.boss.mon)}team.forEach(fixMon);battleOpen=false;$('battle').classList.remove('on');B=null}
$('menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!B||B.busy)return;const i=+b.dataset.m;
  if(B.stage==='items'){if(i===0)return crystal();if(i===1)return potion();if(i===2)return crystal(1);return mainMenu()}
  if(B.stage==='swap'){if(b.dataset.m==='x')return mainMenu();return doSwap(i)}
  if(B.stage==='main'){if(i===0){B.stage='moves';menu(B.me.mv.map(k=>MOVES[k].n).concat('Voltar'))}else if(i===1){B.stage='items';menu(['Cristal ('+inv.cristal+')','Poção ('+inv.pocao+')','Superior ('+inv.superior+')','Voltar'])}else if(i===2)swapMenu();else flee()}
  else if(i>=B.me.mv.length)mainMenu();else round(i)});
async function hit(a,d,m){
  if(a.stat==='sleep'){if(--a.sl>0)return msg(a.n+' está dormindo...');a.stat=null;await msg(a.n+' acordou!')}
  await msg(a.n+(a===B.foe&&!B.boss?' selvagem':'')+' usou '+m.n+'!');
  if(!m.p)return effect(a,d,m);
  const mm=m.t==='normal'?1:mult(m.t,d.t),dmg=Math.max(1,Math.floor(m.p*a.atk*1.4**a.st.atk/(d.def*1.4**d.st.def)/5*mm*(.85+Math.random()*.15)));
  d.hp=Math.max(0,d.hp-dmg);SFX.hit();const el=$(d===B.me?'pc':'fc');el.classList.add('hit');ui();await wait(350);el.classList.remove('hit');
  if(mm>1)await msg('Foi super eficaz!');else if(mm<1)await msg('Não foi muito eficaz...');
  if(m.fx&&d.hp>0)await effect(a,d,m);
}
async function round(i){
  B.busy=true;menu([]);
  const mv=MOVES[B.me.mv[i]],fm=pick(B.foe);
  const order=B.me.spd>=B.foe.spd?[[B.me,B.foe,mv],[B.foe,B.me,fm]]:[[B.foe,B.me,fm],[B.me,B.foe,mv]];
  for(const[a,d,m]of order){if(a.hp<=0)continue;await hit(a,d,m);if(d.hp<=0)break}
  for(const u of [B.me,B.foe])if(u.stat==='burn'&&u.hp>0){u.hp=Math.max(0,u.hp-Math.max(1,Math.floor(u.max/8)));ui();await msg(u.n+' sofre com a queimadura!')}
  if(B.foe.hp<=0)return win();
  if(B.me.hp<=0)return lose();
  mainMenu();
}
async function win(){
  await msg(B.foe.n+(B.boss?'':' selvagem')+' desmaiou!');const xp=B.foe.L*8;B.me.xp+=xp;await msg(B.me.n+' ganhou '+xp+' XP!');
  while(B.me.xp>=B.me.L*10){B.me.xp-=B.me.L*10;const old=B.me.max;B.me.L++;recalc(B.me);B.me.hp=Math.min(B.me.max,B.me.hp+B.me.max-old);ui();SFX.lvl();await msg(B.me.n+' subiu para o nível '+B.me.L+'!');await learnNew(B.me);await evolve(B.me)}
  await afterWin();
  endBattle();
}
async function lose(){await msg(B.me.n+' desmaiou...');if(team.some(m=>m.hp>0)){B.forced=true;return swapMenu()}await msg('Você volta ao ponto inicial.');team.forEach(m=>m.hp=m.max);spawn();endBattle()}
async function flee(){
  B.busy=true;menu([]);
  if(B.boss&&!B.boss.cap){await msg('Não dá para fugir de um guardião!');return mainMenu()}
  if(Math.random()<.75){await msg('Você fugiu!');return endBattle()}
  await msg('Não deu para fugir!');await hit(B.foe,B.me,pick(B.foe));
  if(B.me.hp<=0)return lose();mainMenu();
}

const EVO={1:[0,8],0:[2,12],3:[4,12],4:[5,18],8:[6,8],6:[7,12],9:[11,8],11:[10,12]}; // espécie:[evolui para, nível]

const QUESTS=[
 {ask:'Traga 10 madeira e eu te dou 5 cristais de captura.',ok:'Perfeito! Aqui estão 5 cristais.',check:()=>inv.madeira>=10,reward:()=>{inv.madeira-=10;inv.cristal+=5}},
 {ask:'Registre 4 espécies diferentes na sua coleção (a inicial conta) e ganhe uma picareta de pedra.',ok:'Bom treinador! Fique com esta picareta.',check:()=>caught.size>=4,reward:()=>{inv.pic2=1}},
 {ask:'Derrote um guardião e ganhe 10 cristais. Eles ficam na floresta, no deserto e na neve.',ok:'Que vitória! Aqui está sua recompensa.',check:()=>defeatedNames.length>=1,reward:()=>{inv.cristal+=10}}];
let ents=[],caught=new Set(),quest=[0,0,0],defeatedNames=[],base=null,dlgOpen=false,dq=[],dcb=null;
const entAt=(x,y)=>ents.find(e=>e.x===x&&e.y===y);
function placeEnts(){
  const cave=carveCave();base=tiles.slice();ents=[];if(cave)ents.push({kind:'lend',name:'Cristalino',x:cave[0],y:cave[1],mon:mkMon(15,13),cap:true});const[sx,sy]=findSpawn();
  const free=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&tiles[y*W+x]===2&&!entAt(x,y)&&(x!==sx||y!==sy);
  NPCS.forEach((n,k)=>{const ox=sx+[4,-4,2][k],oy=sy+[2,3,-5][k];
    for(let r=0;r<8;r++){let ok=false;for(let dy=-r;dy<=r&&!ok;dy++)for(let dx=-r;dx<=r&&!ok;dx++)if(free(ox+dx,oy+dy)){ents.push({kind:'npc',name:n.name,q:n.q,c:n.c,x:ox+dx,y:oy+dy});ok=true}if(ok)break}});
  BOSSES.forEach((bs,k)=>{if(defeatedNames.includes(bs.name))return;
    for(let i=0;i<4000;i++){const x=Math.floor(h(i,1,seed+60+k)*W),y=Math.floor(h(i,2,seed+60+k)*H);
      if(biome[y*W+x]===bs.b&&walkable(x,y)&&Math.hypot(x-sx,y-sy)>14){ents.push({kind:'boss',name:bs.name,c:bs.c,x,y,mon:mkMon(bs.sp,bs.L)});break}}});
}
function drawEnts(cx,cy){
  for(const e of ents){const x=e.x*T-cx,y=e.y*T-cy;if(x<-T||y<-T||x>cv.width||y>cv.height)continue;if(e.kind==='lend'){lendDraw(x,y,e);continue}
    if(NPCIMG.ok&&NPCROW[e.name]!==undefined){drawNpc(e,x,y);continue}
    const r=(a,b,w,hh,c)=>{ctx.fillStyle=c;ctx.fillRect(x+a*S,y+b*S,w*S,hh*S)};
    r(4,14,8,2,'rgba(0,0,0,.28)');r(5,13,2,2,'#2f3b7a');r(9,13,2,2,'#2f3b7a');r(5,7,6,6,e.c);r(5,2,6,6,'#f2c9a0');r(5,2,6,2,'#3a2a1a');r(6,5,1,1,'#222');r(9,5,1,1,'#222');
    if(e.kind==='boss'){r(5,0,6,2,'#ffd23a');r(5,0,1,1,'#ffd23a');r(7,0,2,1,'#ffd23a')}
    ctx.font=(S*4)+'px monospace';ctx.textAlign='center';ctx.lineWidth=S;ctx.strokeStyle='#000';ctx.strokeText(e.name,x+T/2,y-S*2);ctx.fillStyle='#fff';ctx.fillText(e.name,x+T/2,y-S*2)}

function dialog(lines,cb){dq=lines.slice();dcb=cb||null;dlgOpen=true;stack.length=0;joyEnd();$('dlg').classList.add('on');dlgNext()}
function dlgNext(){if(dq.length){$('dtext').textContent=dq.shift();return}dlgOpen=false;$('dlg').classList.remove('on');const c=dcb;dcb=null;if(c)c()}
$('dok').addEventListener('click',()=>dlgNext());
function talk(en){en.face=[1,0,3,2][P.face]; // o NPC vira de frente para o jogador
 
  if(dlgOpen)return;
  if(en.kind==='lend')return dialog(['Uma criatura brilhante emerge das sombras da caverna...'],()=>startBattle(en));
  if(en.kind==='boss')return dialog([en.name+': “Prove a sua força!”'],()=>startBattle(en));
  const q=QUESTS[en.q];
  if(quest[en.q]===1)return dialog([en.name+': “Obrigado de novo, treinador!”']);
  if(q.check()){quest[en.q]=1;q.reward();renderInv();save();return dialog([en.name+': “'+q.ok+'”'])}
  dialog([en.name+': “'+q.ask+'”']);
}
function swapMenu(){
  if(!team.some((m,i)=>i&&m.hp>0)){B.busy=true;msg('Não há outra criatura!').then(mainMenu);return}
  B.stage='swap';B.busy=false;$('msg').textContent='Trocar para quem?';
  $('menu').innerHTML=team.map((m,i)=>i&&m.hp>0?'<button data-m="'+i+'">'+m.n+' Nv'+m.L+' '+m.hp+'/'+m.max+'</button>':'').join('')+(B.forced?'':'<button data-m="x">Voltar</button>');
}
async function doSwap(i){
  B.busy=true;menu([]);const forced=B.forced;B.forced=false;
  team[0].st={atk:0,def:0};[team[0],team[i]]=[team[i],team[0]];B.me=team[0];drawMon($('pc').getContext('2d'),B.me.i);ui();
  await msg('Vai, '+B.me.n+'!');
  if(!forced){await hit(B.foe,B.me,pick(B.foe));if(B.me.hp<=0)return lose()}
  mainMenu();
}
async function crystal(sup){
  B.busy=true;
  if(B.boss&&!B.boss.cap){await msg('Não dá para capturar um guardião!');return mainMenu()}
  const key=sup?'superior':'cristal';
  if(!inv[key]){await msg('Você não tem '+(sup?'cristais superiores':'cristais')+'!');return mainMenu()}
  if(team.length>=6){await msg('Sua equipe está cheia!');return mainMenu()}
  menu([]);inv[key]--;renderInv();await msg('Você lançou um cristal!');
  const f=B.foe;
  if(Math.random()<Math.min(.95,(.2+(1-f.hp/f.max)*.7+(sup?.3:0))*(B.boss?.6:1))){caught.add(f.i);team.push(f);if(B.boss)ents.splice(ents.indexOf(B.boss),1);SFX.cap();await msg(f.n+' foi capturado!');save();return endBattle()}
  await msg('Ele escapou!');await hit(f,B.me,pick(f));
  if(B.me.hp<=0)return lose();mainMenu();
}
async function evolve(m){
  const e=EVO[m.i];if(!e||m.L<e[1])return;
  await msg(m.n+' está evoluindo!');const old=m.max;m.i=e[0];m.n=SPECIES[m.i][0];m.t=SPECIES[m.i][1];recalc(m);m.hp+=m.max-old;caught.add(m.i);
  drawMon($('pc').getContext('2d'),m.i);ui();await msg('Evoluiu para '+m.n+'!');
}
async function afterWin(){
  if(!B.boss)return;const bs=B.boss;ents.splice(ents.indexOf(bs),1);if(bs.cap)return;defeatedNames.push(bs.name);inv.cristal+=3;renderInv();save();
  await msg('Você derrotou '+bs.name+'! +3 cristais.');
  if(!ents.some(e=>e.kind==='boss'))await msg('Todos os guardiões caíram! Você é o campeão de Pixelands!');
}
function save(){
  if(!team||!base)return;
  try{const mods=[];for(let i=0;i<W*H;i++)if(tiles[i]!==base[i]||under[i])mods.push([i,tiles[i],under[i]]);
    localStorage.setItem('pixelands_save',JSON.stringify({seed,inv,home,dayT,seen:[...seen],team,caught:[...caught],quest,defeated:defeatedNames,mods,x:P.x,y:P.y}))}catch(e){}
}
function loadGame(){
  try{const d=JSON.parse(localStorage.getItem('pixelands_save'));if(!d)return;
    generate(d.seed);defeatedNames=d.defeated||[];placeEnts();
    for(const[i,t,u]of d.mods){setTile(i,t);under[i]=u}
    inv=Object.assign({erva:0,pocao:0,cama:0,gema:0,superior:0},d.inv);home=d.home||null;dayT=d.dayT||0;team=d.team;team.forEach(fixMon);caught=new Set(d.caught);seen=new Set(d.seen||d.caught);quest=d.quest;if(caught.has(15))ents=ents.filter(e=>e.kind!=='lend');
    spawn();P.x=P.fx=P.tx=d.x;P.y=P.fy=P.ty=d.y;renderInv();start()}catch(e){}
}

const ANIM_T=.4,ANIM_ROW={break:0,place:1,use:2},FACE_ROW=[1,0,3,3]; // rosto: baixo,cima,esq,dir -> linha da folha
function playAnim(k){P.anim={k,time:0}}
function drawHero(x,y,bob){
  if(WALK.ok&&!P.anim){ // andando ou parado: ciclo de caminhada (linhas: baixo, cima, esquerda, direita)
    const fr=P.moving?Math.floor(P.walk*8)%4:0,k=T*1.3/WALK.h,w=WALK.cw*k,hh=WALK.ch*k,fy=y+T*.92;
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+T/2,fy,T*.28,T*.09,0,0,7);ctx.fill();
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(WALK.img,fr*WALK.cw,P.face*WALK.ch,WALK.cw,WALK.ch,Math.round(x+T/2-WALK.ax*k),Math.round(fy-WALK.ay*k),Math.round(w),Math.round(hh));
    ctx.imageSmoothingEnabled=false;return}
  if(!HERO.ok){drawPlayer(x,y,P.face,bob);return}
  const an=P.anim,fr=an?Math.min(3,Math.floor(an.time/ANIM_T*4)):0,row=(an?ANIM_ROW[an.k]:0)*4+FACE_ROW[P.face];
  const k=T*1.3/HERO.h,w=HERO.cw*k,hh=HERO.ch*k,fy=y+T*.92,dx=x+T/2-HERO.ax*k,dy=fy-HERO.ay*k+bob*S;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x+T/2,fy,T*.28,T*.09,0,0,7);ctx.fill();
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  const fl=P.face===2; // esquerda = sprite da direita espelhado
  if(fl){ctx.save();ctx.translate(x+T/2,0);ctx.scale(-1,1)}
  ctx.drawImage(HERO.img,fr*HERO.cw,row*HERO.ch,HERO.cw,HERO.ch,Math.round(fl?-HERO.ax*k:dx),Math.round(dy),Math.round(w),Math.round(hh));
  if(fl)ctx.restore();
  ctx.imageSmoothingEnabled=false;
}

const SPRIMG={};
function loadSpr(i,b64){const im=new Image();im.src='data:image/png;base64,'+b64;SPRIMG[i]=im}
const FACE={1:'L',0:'F',2:'F',12:'F',3:'L',4:'L',5:'F',13:'F',8:'F',6:'L',7:'F',14:'F',9:'F',11:'F',10:'L',15:'L'}; // L = arte olha para a esquerda
const SPRMAX=[150,128];
function drawPng(g,i){ // o jogador (canvas #pc, à esquerda) vê as criaturas 'L' espelhadas
  const im=SPRIMG[i],S0=128,k=Math.min(S0*.96/SPRMAX[0],S0*.9/SPRMAX[1]),w=im.width*k,h=im.height*k,id=g.canvas.id;
  const flip=(FACE[i]==='L'&&id==='pc')||(FACE[i]==='R'&&id==='fc');
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
  g.save();if(flip){g.translate(S0,0);g.scale(-1,1)}
  g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(S0/2,S0*.93,w*.38,S0*.03,0,0,7);g.fill();
  g.drawImage(im,(S0-w)/2,S0*.95-h,w,h);g.restore();
}

        h+='<p>Habitat: '+habitat(i)+'</p><p>'+(from?'Evolui de '+SPECIES[from][0]+' (nv '+EVO[from][1]+'). ':'')+(to?'Evolui para '+SPECIES[to[0]][0]+' no nível '+to[1]+'.':(from?'':'Não evolui.'))+'</p>';
        h+=[['Vida',2],['Ataque',3],['Defesa',4],['Velocidade',5]].map(([nm,k])=>'<div class="dnum">'+nm+' '+sp[k]+'</div><div class="dbar"><i style="width:'+Math.min(100,sp[k]/18*100)+'%"></i></div>').join('');
      }
    }
    box.innerHTML=h;
  }
  box.querySelectorAll('canvas').forEach(c=>drawMon(c.getContext('2d'),+c.dataset.c));
}

// ===== Caverna e criatura lendária =====
function carveCave(){
  for(let i=0;i<4000;i++){
    const x=3+Math.floor(h(i,5,seed+80)*(W-6)),y=2+Math.floor(h(i,6,seed+80)*(H-4));let ok=true;
    for(let dy=-2;dy<=2&&ok;dy++)for(let dx=-3;dx<=3;dx++)if(biome[(y+dy)*W+x+dx]!==4){ok=false;break}
    if(!ok)continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-2;dx<=2;dx++)setTile((y+dy)*W+x+dx,11);
    for(const[dx,dy]of [[-3,0],[3,0],[0,-2],[0,2],[-3,-1],[3,1]])setTile((y+dy)*W+x+dx,14);
    return[x,y];
  }
  return null;
}
const LCV=document.createElement('canvas');LCV.width=LCV.height=16;
function lendDraw(x,y,e){
  if(!LCV.d||(!LCV.p&&okImg(SPRIMG[15]))){drawMon(LCV.getContext('2d'),15);LCV.d=1;LCV.p=okImg(SPRIMG[15])}
  ctx.drawImage(LCV,x,y,T,T);
  ctx.font=(S*4)+'px monospace';ctx.textAlign='center';ctx.lineWidth=S;ctx.strokeStyle='#000';ctx.strokeText(e.name,x+T/2,y-S*2);ctx.fillStyle='#fff';ctx.fillText(e.name,x+T/2,y-S*2);
}

// ===== Som e música (Web Audio) =====
let AC=null,muted=false,mstep=0;
function ac(){
  if(muted)return null;
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}
  if(AC.state==='suspended')AC.resume();return AC;
}
function tone(f,d,type,vol,delay){
  const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d);
}
const seq=(fs,d,type,vol,gap)=>fs.forEach((f,i)=>tone(f,d,type,vol,i*gap));
const SFX={
  pick:()=>{tone(660,.08);tone(990,.1,'square',.05,.07)},
  put:()=>tone(220,.08,'triangle',.08),
  hit:()=>{tone(130,.15,'sawtooth',.09);tone(80,.2,'square',.07,.05)},
  cap:()=>seq([523,659,784,1047],.15,'square',.06,.1),
  lvl:()=>seq([392,523,659,784],.14,'square',.06,.09),
  heal:()=>{tone(523,.1,'sine',.08);tone(784,.2,'sine',.08,.1)}};
const SC=[262,294,330,392,440,523],SCN=[220,262,294,330,392,440],MUL=[1,1,.89,1.12,.8,1.25,1];
const PAT=[0,2,4,2,5,4,2,0,1,3,5,3,4,2,1,-1];
setInterval(()=>{
  if(!started||muted||!AC)return;
  const n=PAT[mstep++%PAT.length],sc=battleOpen||isNight()?SCN:SC,m=battleOpen?1:MUL[biome[P.y*W+P.x]]*.5;
  if(n>=0&&(battleOpen||mstep%2===0))tone(sc[n]*m,.28,'triangle',battleOpen?.045:.03);
  if(mstep%8===1)tone(sc[0]*m/2,.9,'sine',.04);
},230);
$('mute').addEventListener('mousedown',e=>e.preventDefault());
$('mute').addEventListener('click',()=>{muted=!muted;$('mute').textContent=muted?'Som: mudo':'Som: ligado';if(!muted)ac()});

// ===== Habitats e ciclo de dia e noite =====
const DAY_LEN=240; // segundos por dia completo
let dayT=DAY_LEN*.1;
const HAB={1:[6,8,1,9,3],2:[6,7,8,4,11],3:[1,0,9,11,10,2],5:[3,4,5,10],4:[9,10,2,0]}; // criaturas de cada bioma
const NIGHT=[12,13,14]; // aparecem só à noite
function darkness(){const s=Math.sin(dayT/DAY_LEN*2*Math.PI);return Math.max(0,Math.min(1,-s*2))*.62}
const isNight=()=>darkness()>.3;
function encRate(){
  const t=tiles[P.y*W+P.x],b=biome[P.y*W+P.x];
  if(t===8)return ENCOUNTER_RATE;
  if((b===3&&t===1)||(b===5&&t===7))return ENCOUNTER_RATE*.6;
  if(b===4&&t===11)return ENCOUNTER_RATE*.5;
  return 0;
}
function rollSpecies(){
  const pool=(HAB[biome[P.y*W+P.x]]||HAB[1]).slice();if(isNight())pool.push(...NIGHT);
  return pool[Math.floor(Math.random()*pool.length)];
}

// ===== Golpes e status =====
const MOVES={
 invest:NORMAL,
 labareda:{n:'Labareda',p:55,t:'fogo',fx:{burn:.25}},jato:{n:'Jato d’água',p:55,t:'agua'},
 chicote:{n:'Chicote de folhas',p:55,t:'planta'},pedrada:{n:'Pedrada',p:55,t:'terra'},
 chamas:{n:'Explosão de brasas',p:75,t:'fogo',fx:{burn:.35}},onda:{n:'Onda gigante',p:75,t:'agua'},
 lamina:{n:'Lâmina de folhas',p:75,t:'planta'},terremoto:{n:'Terremoto',p:75,t:'terra'},
 rugido:{n:'Rugido',p:0,t:'normal',fx:{st:'def',d:-1}},
 fortalecer:{n:'Fortalecer',p:0,t:'normal',fx:{st:'atk',d:1,self:1}},
 regenerar:{n:'Regenerar',p:0,t:'normal',fx:{heal:.4}},
 esporos:{n:'Esporos',p:0,t:'planta',fx:{sleep:1}}};
const LEARN={ // [nível, golpe]
 fogo:[[1,'invest'],[1,'labareda'],[6,'rugido'],[9,'chamas'],[13,'fortalecer']],
 agua:[[1,'invest'],[1,'jato'],[6,'rugido'],[9,'onda'],[13,'regenerar']],
 planta:[[1,'invest'],[1,'chicote'],[6,'esporos'],[9,'lamina'],[13,'regenerar']],
 terra:[[1,'invest'],[1,'pedrada'],[6,'rugido'],[9,'terremoto'],[13,'fortalecer']]};
const tg=m=>m.stat==='burn'?' (queimado)':m.stat==='sleep'?' (dormindo)':'';
function learn(m,k){if(m.mv.includes(k))return false;m.mv.push(k);if(m.mv.length>4)m.mv.splice(1,1);return true}
function fixMon(m){if(!m.mv){m.mv=[];LEARN[m.t].forEach(([lv,k])=>{if(lv<=m.L)learn(m,k)})}m.st={atk:0,def:0};m.stat=null;m.sl=0}
async function learnNew(m){for(const[lv,k]of LEARN[m.t])if(lv===m.L&&learn(m,k))await msg(m.n+' aprendeu '+MOVES[k].n+'!')}
async function effect(a,d,m){
  const f=m.fx;
  if(f.burn&&!d.stat&&Math.random()<f.burn){d.stat='burn';ui();await msg(d.n+' se queimou!')}
  if(f.sleep){if(d.stat)await msg('Não teve efeito...');else{d.stat='sleep';d.sl=2+Math.floor(Math.random()*2);ui();await msg(d.n+' adormeceu!')}}
  if(f.st){const t=f.self?a:d;t.st[f.st]=Math.max(-3,Math.min(3,t.st[f.st]+f.d));await msg(t.n+' teve '+(f.st==='atk'?'o ataque':'a defesa')+(f.d>0?' aumentada!':' reduzida!'))}
  if(f.heal){a.hp=Math.min(a.max,a.hp+Math.floor(a.max*f.heal));ui();await msg(a.n+' recuperou vida!')}
}

// ===== Cura e itens =====
let home=null; // ponto de retorno (cama)
async function potion(){
  B.busy=true;const m=B.me;
  if(!inv.pocao){await msg('Você não tem poções!');return mainMenu()}
  if(m.hp>=m.max){await msg(m.n+' já está com a vida cheia!');return mainMenu()}
  menu([]);inv.pocao--;renderInv();m.hp=Math.min(m.max,m.hp+30);SFX.heal();ui();await msg(m.n+' recuperou vida!');
  await hit(B.foe,m,pick(B.foe));if(m.hp<=0)return lose();mainMenu();
}

// ===== Atualização =====
function update(dt){
  if(craftOpen||battleOpen||dlgOpen||dexOpen)return;
  if(P.anim){P.anim.time+=dt;if(P.anim.time>=ANIM_T)P.anim=null}
  if(!P.moving&&!P.anim){
    const d=curDir();
    if(d>=0){P.face=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];
      if(walkable(nx,ny)){P.tx=nx;P.ty=ny;P.t=0;P.moving=true}}
  }
  if(P.moving){
    P.t+=dt;P.walk+=dt;
    const k=Math.min(1,P.t/MOVE_TIME);
    P.fx=P.x+(P.tx-P.x)*k;P.fy=P.y+(P.ty-P.y)*k;
    if(k>=1){P.x=P.tx;P.y=P.ty;P.fx=P.x;P.fy=P.y;P.moving=false;
      if(team){if(++steps%4===0&&team[0].hp<team[0].max)team[0].hp++;
        if(Math.random()<encRate())startBattle()}}
  }
}

// ===== Desenho =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mmc=document.getElementById('mm').getContext('2d'),info=document.getElementById('info');
let S=3,T=48;
function resize(){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,hh=cv.clientHeight;
  cv.width=Math.floor(w*dpr);cv.height=Math.floor(hh*dpr);
  S=Math.max(2,Math.floor(Math.min(cv.width,cv.height)/160));T=16*S;
}
addEventListener('resize',resize);
function drawPlayer(x,y,face,bob){
  const r=(a,b,w,hh,c)=>{ctx.fillStyle=c;ctx.fillRect(x+a*S,y+(b+bob)*S,w*S,hh*S)};
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(x+4*S,y+14*S,8*S,2*S);
  r(5,13,2,2,'#2f3b7a');r(9,13,2,2,'#2f3b7a');
  r(5,7,6,6,'#d94f3d');r(5,7,6,1,'#f27a64');
  r(5,2,6,6,'#f2c9a0');
  if(face===1){r(5,2,6,6,'#4a2e1a')}
  else{r(5,2,6,2,'#4a2e1a');
    if(face===0){r(5,4,1,2,'#4a2e1a');r(10,4,1,2,'#4a2e1a');r(6,5,1,1,'#222');r(9,5,1,1,'#222')}
    else if(face===2){r(8,4,3,2,'#4a2e1a');r(6,5,1,1,'#222')}
    else{r(5,4,3,2,'#4a2e1a');r(9,5,1,1,'#222')}}
}
let last=0,started=false,time=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time+=dt;
  if(started){update(dt);dayT+=dt}
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#141a2a';ctx.fillRect(0,0,cv.width,cv.height);
  const camX=Math.round(P.fx*T+T/2-cv.width/2),camY=Math.round(P.fy*T+T/2-cv.height/2);
  const x0=Math.max(0,Math.floor(camX/T)),y0=Math.max(0,Math.floor(camY/T));
  const x1=Math.min(W-1,Math.floor((camX+cv.width)/T)),y1=Math.min(H-1,Math.floor((camY+cv.height)/T));
  const wf=Math.floor(time*2.5)%6;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i0=y*W+x,t=tiles[i0],px=x*T-camX,py=y*T-camY;
    if(t===4||t===5||t===14||t===10||t===12||t===13)ctx.drawImage(baseTex(under[i0]||(t===10||t===12||t===13?2:11),x,y),px,py,T,T); // chão por baixo do bloco
    ctx.drawImage(t===0?(WV?WV[wf%3][0]:WATER[wf%2]):baseTex(t,x,y),px,py,T,T)}
  drawEnts(camX,camY);
  if(started&&!craftOpen&&!P.moving){const hx=P.x+DIRS[P.face][0],hy=P.y+DIRS[P.face][1];ctx.strokeStyle='#f2b134';ctx.lineWidth=Math.max(2,S);ctx.strokeRect(hx*T-camX+S,hy*T-camY+S,T-2*S,T-2*S)}
  const bob=P.moving&&Math.floor(P.walk*12)%2?-1:0;
  drawHero(Math.round(P.fx*T-camX),Math.round(P.fy*T-camY),bob);
  const dk=darkness();
  if(dk>0){const px=P.fx*T-camX+T/2,py=P.fy*T-camY+T/2,gr=ctx.createRadialGradient(px,py,T*1.5,px,py,T*6);
    gr.addColorStop(0,'rgba(8,12,44,'+dk*.25+')');gr.addColorStop(1,'rgba(8,12,44,'+dk+')');ctx.fillStyle=gr;ctx.fillRect(0,0,cv.width,cv.height)}
  mmc.drawImage(mmBase,0,0);mmc.fillStyle='#ff3b3b';mmc.fillRect(P.x-1,P.y-1,3,3);
  const mon=team&&team[0];info.textContent=BIOMES[biome[P.y*W+P.x]]+'  '+P.x+','+P.y+(isNight()?'  Noite':'  Dia')+(mon?'\n'+mon.n+' Nv'+mon.L+'  '+mon.hp+'/'+mon.max+'\nColeção '+caught.size+'/'+SPECIES.length:'');
  requestAnimationFrame(frame);
}

// ===== Início =====
function start(){ac();document.getElementById('title').style.display='none';if(team)started=true;else showStarter()}
function newWorld(){generate(1+Math.floor(Math.random()*900));defeatedNames=[];home=null;placeEnts();spawn();resetInv()}
document.getElementById('play').addEventListener('click',start);
document.getElementById('newworld').addEventListener('click',newWorld);
generate(7);placeEnts();spawn();resize();resetInv();requestAnimationFrame(frame);
</script>
